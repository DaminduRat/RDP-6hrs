name: Windows-RDP
on: workflow_dispatch

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
    - name: Download & Extract Ngrok
      run: |
        Invoke-WebRequest https://bin.equinox.io/c/bNyj1mQVY4c/ngrok-v3-stable-windows-amd64.zip -OutFile ngrok.zip
        Expand-Archive ngrok.zip -DestinationPath .

    - name: Authenticate Ngrok
      run: |
        .\ngrok.exe config add-authtoken ${{ secrets.NGROK_AUTH_TOKEN }}

    - name: Enable Remote Desktop (RDP)
      run: |
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -name "fDenyTSConnections" -Value 0
        Enable-NetFirewallRule -DisplayGroup "Remote Desktop"
        Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -name "UserAuthentication" -Value 1

    - name: Create RDP User Credentials
      run: |
        net user runneradmin Pass@word1234 /add
        net localgroup administrators runneradmin /add

    - name: Start Ngrok Tunnel
      run: |
        Start-Process powershell -ArgumentList '-NoExit', '-Command', '.\ngrok.exe tcp 3389'
        Start-Sleep -Seconds 5

    - name: Display Connection Info
      run: |
        $response = Invoke-RestMethod -Uri http://localhost:4040/api/tunnels
        $rdp_url = $response.tunnels[0].public_url -replace 'tcp://', ''
        Write-Host "==========================================" -ForegroundColor Green
        Write-Host "RDP Address: $rdp_url" -ForegroundColor Cyan
        Write-Host "Username   : runneradmin" -ForegroundColor Cyan
        Write-Host "Password   : Pass@word1234" -ForegroundColor Cyan
        Write-Host "==========================================" -ForegroundColor Green

    - name: Keep Alive (Keep Runner Running)
      run: |
        while ($true) {
            Start-Sleep -Seconds 60
        }
